<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDK Test - Vanilla JS</title>
  </head>
  <body>
    <h1>Ucoder Insight SDK Test</h1>
    <button id="btn-buy">Buy Now ($50)</button>
    <button id="btn-error">Trigger Error</button>

    <script src="./dist/index.global.js"></script>

    <script>
      console.log("1. Testing Queue: Tracking before init...");
      if (window.ucoderInsight) {
        window.ucoderInsight.track({
          name: "page_loaded_early",
          data: { timestamp: Date.now() },
        });
      }

      // ২. SDK Initialize করা
      console.log("2. Initializing SDK...");
      if (window.ucoderInsight) {
        window.ucoderInsight
          .init("KQN4KiXxX4", {
            trackClicks: true,
            trackPageViews: true,
          })
          .then((config) => {
            console.log(" SDK Initialized inside HTML promise!", config);
          });
      }

      // ৩. Button Click Tracking Test
      document.getElementById("btn-buy").addEventListener("click", () => {
        console.log("3. Tracking custom click...");
        window.ucoderInsight.track({
          name: "button_click",
          data: { id: "btn-buy", price: 50 },
        });
        alert("Event sent! Check console.");
      });

      // ৪. Ready Event Listener Test
      window.addEventListener("ucoderInsightReady", (e) => {
        console.log("🎉 Event Received: ucoderInsightReady", e.detail);
      });
    </script>
  </body>
</html>
